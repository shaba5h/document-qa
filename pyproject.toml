[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "document-qa"
version = "0.1.0"
description = "Document question answering with local CLI and Telegram bot interfaces."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "sentence-transformers",
    "python-dotenv>=1.2.2",
    "langchain-openrouter>=0.0.2",
    "pydantic-settings>=2.13.1",
    "pydantic>=2.12.5",
    "typer>=0.21.2",
    "docling>=2.90.0",
    "rich>=14.3.3",
    "lancedb>=0.30.2",
    "langchain-core>=1.3.2",
    "docling-core>=2.74.1",
    "aiogram>=3.28.2",
]

[project.scripts]
document-qa = "document_qa.entrypoints.cli:main"
document-qa-telegram = "document_qa.entrypoints.telegram_bot:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ty>=0.0.32",
]
